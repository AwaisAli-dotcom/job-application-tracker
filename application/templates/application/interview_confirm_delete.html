{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Interview</title>
    <link rel="stylesheet" href="{% static 'application/style.css' %}">
</head>
<body>

<div class="container">
    <h1>Delete Interview</h1>

    <a class="back-link" href="{% url 'application_detail' interview.application.pk %}">
        Back to Application
    </a>

    <div class="form-card delete-confirmation">
        <p>
            Are you sure you want to delete the
            <strong>{{ interview.get_interview_type_display }}</strong>
            interview for <strong>{{ interview.application.company }}</strong>?
        </p>

        <p class="delete-warning">
            This cannot be undone.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="delete-actions">
                <button type="submit" class="danger-button">Yes, delete it</button>
                <a class="edit-link" href="{% url 'application_detail' interview.application.pk %}">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
