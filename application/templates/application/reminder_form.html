{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Reminder - {{ application.company }}</title>
    <link rel="stylesheet" href="{% static 'application/style.css' %}">
</head>
<body>

<div class="container">
    <h1>{% if reminder %}Edit Reminder{% else %}Add Reminder{% endif %}</h1>
    <a class="back-link" href="{% url 'application_detail' application.pk %}">
        Back to Application
    </a>

    <form method="POST" class="form-card">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Reminder</button>
    </form>
</div>

</body>
</html>
