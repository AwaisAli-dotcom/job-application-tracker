{% extends 'application/base.html' %}

{% block title %}Add Document - {{ application.company }}{% endblock %}

{% block content %}
<div class="container">
    <h1>Add Document</h1>
    <a class="back-link" href="{% url 'application_detail' application.pk %}">
        Back to Application
    </a>

    <form method="POST" class="form-card">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Document</button>
    </form>
</div>
{% endblock %}
