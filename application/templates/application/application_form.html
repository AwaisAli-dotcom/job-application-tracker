{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Application</title>
<link rel="stylesheet" href="{% static 'application/style.css' %}">    
</head>
<body>

<div class="container">
    <h1>Add Job Application</h1>
    <a class="back-link" href="{% url 'application_list' %}">
    Back to Applications
</a>

    <form method="POST" class="form-card">
        {% csrf_token %}

        <p class="required-note"><span class="required-marker">*</span> Required fields</p>

        {% for field in form %}
            <div class="form-field">
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                    {% if field.field.required %}
                        <span class="required-marker" aria-hidden="true">*</span>
                        <span class="sr-only">required</span>
                    {% endif %}
                </label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <button type="submit">Save Application</button>
    </form>
</div>

<script>
    document.querySelectorAll('.form-field input, .form-field select, .form-field textarea').forEach(function (field) {
        field.addEventListener('input', clearFieldError);
        field.addEventListener('change', clearFieldError);
    });

    function clearFieldError(event) {
        var fieldWrapper = event.target.closest('.form-field');
        var errorList = fieldWrapper.querySelector('.errorlist');

        if (errorList) {
            errorList.remove();
        }

        event.target.removeAttribute('aria-invalid');
    }
</script>

</body>
</html>
