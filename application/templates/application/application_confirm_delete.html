{% extends 'application/base.html' %}

{% block title %}Delete Application{% endblock %}

{% block content %}
<div class="container">
    <h1>Delete Job Application</h1>

    <a class="back-link" href="{{ cancel_url }}">&larr; Back</a>

    <div class="form-card delete-confirmation">
        <p>
            Are you sure you want to delete the application for
            <strong>{{ job.job_title }}</strong> at <strong>{{ job.company }}</strong>?
        </p>

        <p class="delete-warning">
            This cannot be undone.
        </p>

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="return_to" value="{{ return_url }}">
            <input type="hidden" name="cancel_to" value="{{ cancel_url }}">
            <div class="delete-actions">
                <button type="submit" class="danger-button">Yes, delete it</button>
                <a class="edit-link" href="{{ cancel_url }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
